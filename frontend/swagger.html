<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNGPC Xtract // API Docs</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html {
            box-sizing: border-box;
            background: #0d0e12;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom premium dark styling matching our existing terminal layout */
        .swagger-ui {
            filter: invert(90%) hue-rotate(180deg); /* Premium dark mode conversion */
            padding-bottom: 60px;
        }
        /* Override invert filter for images/svg icons if necessary */
        .swagger-ui img, .swagger-ui .model-box-control:focus {
            filter: invert(0%) hue-rotate(0deg);
        }
        .swagger-ui .topbar {
            display: none; /* Hide standard Swagger topbar */
        }
        .brand-header {
            background: #0a0b0d;
            border-bottom: 1px solid #1e2029;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #00ff66; /* Neon green code-style accent */
        }
        .back-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #8892b0;
            text-decoration: none;
            border: 1px solid #1e2029;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            color: #ffffff;
            border-color: #8892b0;
            background: #161821;
        }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="brand-title">SNGPC // XTRACTOR // API DOCS</div>
        <a href="/" class="back-btn">&lt; VOLTAR AO TERMINAL</a>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "/frontend/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout"
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
